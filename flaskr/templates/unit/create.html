{% extends 'base.html' %}
{% block title %}New Unit{% endblock %}

{% block content %}
  <section class="content">
    <header>
      <h1>New Unit</h1>
    </header>

    <form method="post">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" value="{{request.form['name']}}" required autofocus>
      <div class="flex-container">
        <input type="submit" value="Create">
        <button type="button" onclick='location.href="{{url_for("unit.index")}}"'>Cancel</button>
      </div>
    </form>
  </section>
{% endblock content %}

{% block script %}{% endblock script %}

{% extends 'base.html' %}
{% block title %}Units{% endblock %}

{% block content %}
  <section class="content">
    <header>
      <h1>Units</h1>
      <form class="action" action="{{url_for('unit.create')}}" method="get">
        <button type="submit">Add Unit</button>
      </form>
    </header>

    {% if units %}
      <table class="item-list">
        <colgroup>
          <col>
          <col span="2">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="colgroup" colspan="2">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for unit in units %}
            <tr id="tr_{{unit['id']}}">
              <td>{{unit['name']}}</td>
              <td>
                <form action="{{url_for('unit.modify', unit_id=unit['id'])}}" method="get">
                  <button type="submit">Edit</button>
                </form>
              </td>
              <td>
                <!-- single-quoted attribute: tojson emits double quotes and escapes single quotes -->
                <form action="{{url_for('unit.delete', unit_id=unit['id'])}}" method="get"
                      onsubmit='return confirm("Delete " + {{unit["name"]|tojson}} + " and all of its models and weapons?");'>
                  <button type="submit" class="danger">Delete</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="about">No units yet.</p>
    {% endif %}
  </section>
{% endblock content %}

{% block script %}{% endblock script %}

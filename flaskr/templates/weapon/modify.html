{% extends 'base.html' %}
{% block title %}Edit {{weapon['name']}}{% endblock title %}

{% block content %}
  <section class="content">
    <header>
      <h1>Edit {{weapon['name']}}</h1>
    </header>

    <form method="post">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" value="{{weapon['name']}}" required>
      <label for="attacks">A</label>
      <input type="text" name="attacks" id="attacks" pattern="{{roll_pattern}}" value="{{weapon['attacks']}}">
      <label for="skill">BS/WS</label>
      <input type="number" name="skill" id="skill" min="1" max="6" value="{{weapon['skill']}}">
      <label for="strength">S</label>
      <input type="number" name="strength" id="strength" min="1" max="99" value="{{weapon['strength']}}">
      <label for="ap">AP</label>
      <input type="number" name="ap" id="ap" min="0" max="99" value="{{weapon['ap']}}">
      <label for="damage">D</label>
      <input type="text" name="damage" id="damage" pattern="{{roll_pattern}}" value="{{weapon['damage']}}">
      <div class="flex-container">
        <input type="submit" value="Save">
        <button type="button" onclick='location.href="{{url_for("model.modify", unit_id=unit_id, model_id=model_id)}}"'>Cancel</button>
      </div>
    </form>
  </section>
{% endblock content %}

{% block script %}{% endblock script %}
